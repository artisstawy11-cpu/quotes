<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>عروض أسعار Designly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mut:#6b7079;--line:#e3e5ea;--pri:#14213d;--gold:#a8832f;--gold2:#c9a54d;--ok:#1f8a4c;--bad:#c0392b;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
body{direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hide{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .brand{font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.top .brand small{font-weight:500;opacity:.7;letter-spacing:0;font-size:12px}
.top .dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;color:#111}
.top nav{margin-inline-start:auto;display:flex;gap:4px}
.top nav button{background:transparent;border:0;color:#cfd4e0;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap}
.top nav button.on{background:rgba(255,255,255,.14);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 12px 120px}
/* cards & forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-inline-start:auto}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
label.f>span{display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=url],input[type=date],select,textarea{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical;line-height:1.6}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;background:#eceef2;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--pri);color:#fff}.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#141414}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:#fbeceb;color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.full{width:100%}
.btn:disabled{opacity:.5}
.muted{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* steps */
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;position:sticky;top:52px;z-index:20;background:var(--bg)}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.steps button i{font-style:normal;opacity:.6;margin-inline-end:4px}
/* services */
.cat{margin-bottom:10px}
.cat>summary{cursor:pointer;font-weight:700;padding:10px 4px;list-style:none;display:flex;align-items:center;gap:8px}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .c{margin-inline-start:auto;background:#eef0f4;border-radius:12px;padding:1px 9px;font-size:12px;color:var(--mut)}
.svc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
.svc.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.svc .hd{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.svc .hd .nm{flex:1;font-weight:600;font-size:14.5px;line-height:1.4}
.svc .hd .pr{font-size:12.5px;color:var(--mut);white-space:nowrap}
.svc .bd{padding:4px 12px 12px;border-top:1px dashed var(--line)}
.sw{width:44px;height:26px;border-radius:13px;background:#d5d8de;position:relative;flex:none;transition:.2s}
.sw:after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.on>.hd .sw,.sw.on{background:var(--ok)}.on>.hd .sw:after,.sw.on:after{right:21px}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:#eef0f4;color:var(--mut);white-space:nowrap}
.tag.m{background:#e8f3ec;color:var(--ok)}.tag.a{background:#efeafd;color:#5b3fc4}
/* payments */
.pay{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.pay .amt{font-weight:800;font-size:18px;color:var(--pri)}
.pay .br{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.6}
.pct-grid{display:grid;grid-template-columns:1fr 84px;gap:6px;align-items:center;margin-top:8px;font-size:13px}
/* sticky bottom */
.dock{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.dock .tot{flex:1;min-width:0;line-height:1.25}.dock .tot b{font-size:17px;display:block}.dock .tot span{font-size:11.5px;color:var(--mut)}
/* list */
.qitem{display:flex;gap:12px;align-items:center}
.qitem .lg{width:46px;height:46px;border-radius:12px;background:#eef0f4;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mut)}
.qitem .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.qitem .in{flex:1;min-width:0}.qitem .in b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{font-size:11px;padding:2px 8px;border-radius:8px;background:#eef0f4}
.st.sent{background:#e7f0fb;color:#1d5fa8}.st.won{background:#e8f3ec;color:var(--ok)}.st.lost{background:#fbeceb;color:var(--bad)}
/* preview */
.pv{display:flex;flex-direction:column;align-items:center;gap:14px}
.pv .pw{box-shadow:0 4px 18px rgba(0,0,0,.12);background:#fff;overflow:hidden}
.pv .pw>.qpage{transform-origin:top right}
/* brand */
.brandbox{display:flex;gap:12px;align-items:center}
.brandbox .lg{width:76px;height:76px;border-radius:14px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;flex:none;cursor:pointer}
.brandbox .lg img{width:100%;height:100%;object-fit:contain}
.sws{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sws label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.sws input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.img3d{background:repeating-conic-gradient(#f0f0f0 0 25%,#fff 0 50%) 0 0/18px 18px;border-radius:12px;min-height:180px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.img3d img{max-width:100%;max-height:420px}
/* toast & overlay */
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#16181d;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(16,18,24,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .box{background:#fff;border-radius:18px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto}
.prog{min-width:260px;text-align:center}
.prog ol{text-align:right;padding-inline-start:20px;font-size:14px;line-height:2}
.prog li.done{color:var(--ok)}.prog li.run{font-weight:700}.prog li.fail{color:var(--bad)}
.spin{width:34px;height:34px;border:3px solid #e6e6e6;border-top-color:var(--gold);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:380px;margin:12vh auto 0}
.hero-btn{font-size:16px;padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv b{text-align:left;direction:ltr}
@media (min-width:760px){ .two{display:grid;grid-template-columns:1fr 1fr;gap:12px} }

@media (max-width:520px){ .top .brand small{display:none} .top .brand .wm{display:none} .top nav button{padding:7px 8px;font-size:13px} .top{gap:6px} }
html,body{overflow-x:hidden}
</style>
<style>/* ===== قالب عرض السعر (صفحات A4 بعرض 794px) ===== */
.qpage{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;color:#1d1d1f;
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;direction:rtl;box-sizing:border-box;
  --p:#14213d;--a:#5b5bd6;--t:#eef0fb;--gold:#8a6a1f;--gold2:#c9a54d;--ink:#1d1d1f;--mut:#6b6f76;--line:#d9dbe0}
.qpage *{box-sizing:border-box}
.qbody{position:absolute;top:58px;right:76px;left:76px;bottom:62px}
.qfoot{position:absolute;bottom:22px;right:76px;left:76px;display:flex;justify-content:space-between;
  font-size:9.5px;color:#9a9ea6;letter-spacing:.2px;border-top:1px solid #eee;padding-top:7px}
.qblk{display:flow-root}
.qdoc-measure{position:absolute;left:-10000px;top:0;width:642px;visibility:hidden}

/* header */
.qh-banner{height:58px;border-radius:40px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(180deg,#ffffff 0%,#e9e9ea 55%,#d3d3d5 100%);box-shadow:inset 0 2px 4px #fff,0 1px 2px rgba(0,0,0,.12);position:relative}
.qh-banner:before,.qh-banner:after{content:'';position:absolute;top:9px;width:92px;height:38px;border-radius:30px;
  background:linear-gradient(180deg,#fff,#e6e6e8);box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.qh-banner:before{right:12px}.qh-banner:after{left:12px}
.qh-banner img{height:40px;max-width:260px;object-fit:contain}
.qh-word{font-weight:800;font-size:22px;letter-spacing:3px;color:#111}
.qh-title{text-align:center;margin-top:16px;font-weight:700;font-size:19px;color:var(--ink)}
.qh-sub{text-align:center;color:#8d9097;font-size:14px;margin-top:2px}
.qh-row{display:flex;gap:12px;margin-top:14px;align-items:stretch}
.qh-from,.qh-to{border:1.5px solid var(--gold);border-radius:24px;background:linear-gradient(180deg,#fafafa,#dcdcde);
  padding:10px 18px;font-size:11px;line-height:1.65;box-shadow:inset 0 2px 3px #fff}
.qh-from{flex:1}.qh-to{width:190px;display:flex;flex-direction:column;justify-content:center}
.qh-from b{font-size:12.5px}.qh-to b{font-size:16px}
.qline{height:4px;margin:14px 0 4px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold2) 50%,var(--gold) 80%,transparent);border-radius:4px;opacity:.85}

/* hero */
.qtag{margin-top:16px;font-size:16px;font-weight:700;color:var(--a)}.qtag span{color:var(--mut);font-weight:500;font-size:14px}
.qhero{text-align:center;margin:8px 0 4px;height:370px}.qhero img{width:100%;height:100%;object-fit:contain}
.qh1{font-size:25px;font-weight:700;line-height:1.45;color:var(--ink);margin-top:6px}.qh1 em{font-style:normal;color:var(--a)}
.qlead{color:var(--mut);font-size:13.5px;line-height:1.75;margin-top:4px}
.qp{font-size:13px;line-height:1.85;color:#333;margin-top:6px}.qp strong{color:var(--p)}
.qstats{display:flex;gap:12px;margin-top:14px}
.qstat{flex:1;background:var(--t);border-radius:4px;padding:10px 8px;text-align:center}
.qstat b{display:block;font-size:22px;font-weight:700;color:var(--p);line-height:1.2}.qstat span{font-size:12px;color:#444}

/* sections */
.qsec{margin-top:22px}
.qkick{font-size:12px;color:var(--a);font-weight:600}.qkick i{font-style:normal;color:var(--gold2);margin-left:6px;font-weight:700}
.qh2{font-size:25px;font-weight:700;color:var(--ink);line-height:1.35;margin-top:2px}
.qh3{font-size:18px;font-weight:700;color:var(--p);margin-top:16px;display:flex;align-items:center;gap:8px}
.qh3 .n{font-size:12px;color:var(--gold2);font-weight:700}
.qmeta{font-size:13px;color:#555;margin-top:2px}.qmeta b{color:var(--ink)}
.qul{margin:8px 0 0;padding:0 18px 0 0;font-size:12.5px;line-height:1.8;color:#444}
.qul li{margin:2px 0}.qul li::marker{color:var(--a)}.qul b{color:var(--p)}
.qcounts{display:flex;gap:10px;margin-top:10px}
.qcounts div{flex:1;background:var(--t);padding:8px;text-align:center;border-radius:3px}
.qcounts b{display:block;color:var(--gold2);font-size:20px;line-height:1.2}.qcounts span{font-size:11.5px;color:#333}
.qbud{display:flex;border:1px solid var(--line);margin-top:10px}
.qbud .v{width:110px;border-left:1px solid var(--line);padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.qbud .v b{font-size:16px;color:var(--p)}.qbud .v span{font-size:10.5px;color:var(--mut)}
.qbud .d{flex:1;padding:8px 12px}.qbud .d b{font-size:14px;color:var(--p)}.qbud .d p{margin:2px 0 0;font-size:12px;color:#555;line-height:1.6}

/* table */
.qtr{display:grid;grid-template-columns:var(--cols);border-inline:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}
.qtr>div{padding:7px 9px;border-left:1px solid var(--line);display:flex;align-items:center;line-height:1.5}
.qtr>div:last-child{border-left:0}
.qtr.h{background:var(--p);color:#fff;font-weight:700;border-color:var(--p)}.qtr.h>div{border-color:rgba(255,255,255,.35)}
.qtr .nm{font-weight:700;color:var(--ink)}.qtr .ds{color:#666;font-size:11.5px}.qtr .num{justify-content:center;font-weight:700;white-space:nowrap}
.qtr.tot{background:var(--t);font-weight:700;color:var(--p)}
.qfree{color:#1a8a4a}
.qsum{margin-top:12px;font-size:14px;line-height:1.9}.qsum b{color:var(--ink)}.qsum .big{font-size:17px;font-weight:700}
.qbar{display:flex;background:var(--p);color:#fff;margin-top:12px;align-items:stretch}
.qbar .v{padding:12px 16px;font-size:24px;font-weight:700;white-space:nowrap;display:flex;align-items:center;border-left:1px solid rgba(255,255,255,.25)}
.qbar .d{padding:10px 14px;font-size:12px;line-height:1.6;display:flex;align-items:center;opacity:.95}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.qchips span{background:var(--t);color:var(--p);padding:5px 12px;font-size:12px;border-radius:3px;font-weight:600}

/* payments */
.qpay{display:flex;margin-top:8px;background:var(--t)}.qpay.alt{background:#fff;border:1px solid var(--line)}
.qpay .v{width:120px;padding:10px;text-align:center;border-left:4px solid #fff;display:flex;flex-direction:column;justify-content:center}
.qpay .v b{font-size:22px;color:var(--p);line-height:1.2}.qpay .v span{font-size:10.5px;color:var(--mut)}
.qpay .d{flex:1;padding:10px 14px}.qpay .d b{font-size:14px;color:var(--ink)}.qpay .d p{margin:3px 0 0;font-size:11.5px;color:#555;line-height:1.6}
.qnote{font-size:12px;color:#555;line-height:1.7;margin-top:10px}.qnote b{color:var(--ink)}

/* timeline */
.qtl{display:flex;align-items:stretch;margin-top:0}
.qtl .n{width:46px;background:var(--t);color:var(--a);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.qtl .k{width:92px;font-size:12px;font-weight:600;display:flex;align-items:center;padding:0 10px}
.qtl .d{flex:1;padding:7px 0}.qtl .d b{font-size:13.5px}.qtl .d p{margin:1px 0 0;font-size:11.5px;color:#666}
.qbox2{display:flex;gap:10px;margin-top:10px}
.qbox2>div{flex:1;border:1px solid var(--line);background:#f7f8fa;padding:10px 14px}
.qbox2 h4{margin:0;color:var(--a);font-size:14px}.qbox2 .big{font-size:22px;font-weight:700;margin-top:6px}

/* closing */
.qclose{text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid #ccc}
.qclose b{font-size:18px;color:var(--p)}.qclose p{margin:2px 0 0;font-size:13px;color:#555}
.qslogan{text-align:center;font-weight:700;font-size:13px;margin-top:12px}
.qsign{margin-top:12px;font-size:12px}.qsign h5{margin:0 0 4px;font-size:13px}
.qsign div{color:#444;margin-top:4px}
.qgoldtag{margin:12px auto 0;width:max-content;max-width:100%;background:var(--gold);color:#f3e2b5;font-size:11px;padding:3px 10px;border-radius:3px}
.qgoldtag b{color:#fff}
.qabout{display:flex;gap:12px;align-items:center;margin-top:8px;border-radius:30px;padding:8px 16px;
  background:linear-gradient(180deg,#f4f4f5,#cfcfd2);font-size:10.5px;line-height:1.6;color:#222}
.qabout img{height:40px;width:40px;object-fit:contain;flex:none}.qabout .mk{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.qabout b{font-size:11.5px}

/* bank + partners */
.qbank{display:flex;gap:10px;align-items:center;margin-top:10px}
.qbank .tb{flex:1}
.qbank .doc{width:100px;flex:none;height:140px}.qbank .doc img{width:100%;height:100%;object-fit:contain}
.qbr{display:grid;grid-template-columns:120px 1fr;gap:3px;margin-top:3px;font-size:12.5px}
.qbr>div{background:#ececec;padding:7px 10px;text-align:center}.qbr>div:first-child{text-align:right}
.qbr.h>div{background:var(--gold);color:#fff;font-weight:700}
.qpart-h{text-align:center;color:var(--gold);font-weight:700;font-size:20px;margin-top:14px}
.qpart{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #e6e6e6;margin-top:4px}
.qpart a{display:block;border-left:1px solid #e6e6e6;text-decoration:none}.qpart a:nth-child(4n){border-left:0}
.qpart .im{height:128px;display:flex;align-items:center;justify-content:center;padding:4px;background:#fff}
.qpart .im img{max-width:100%;max-height:100%;object-fit:contain}
.qpart .im .ph{font-size:11px;color:#999;direction:ltr}
.qpart .bt{background:linear-gradient(180deg,#9b7a2b,#7a5c1a);color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:4px}
.qstrip{margin-top:8px;text-align:center;height:210px}.qstrip img{width:100%;height:100%;object-fit:contain}
.qlogos{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #e6e6e6}
.qlogos>div{height:74px;display:flex;align-items:center;justify-content:center;padding:8px 14px;border-left:1px solid #e6e6e6}
.qlogos>div:nth-child(4n){border-left:0}.qlogos img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="dot">D</span><span class="wm">DESIGNLY</span> <small>عروض الأسعار</small></div>

/* ===== الحسابات: الأتعاب والضريبة والدفعات ===== */
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const fmt = (n, dec) => {
  n = r2(n || 0);
  const d = dec != null ? dec : (Math.abs(n % 1) > 0.001 ? 2 : 0);
  return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
};

// صافي أتعاب ديزاينلي لكل بند (قبل الضريبة)
function itemNet(it, q) {
  const vr = (q.vatRate != null ? q.vatRate : 15) / 100;
  let v = it.kind === 'ads' ? (+it.budget || 0) * (+it.fee || 0) / 100 : (+it.price || 0);
  if (q.pricesIncludeVat && it.kind !== 'ads') v = v / (1 + vr);
  return r2(v);
}

function computeQuote(q) {
  const vr = (q.vatRate != null ? q.vatRate : 15) / 100;
  const items = (q.items || []).filter(i => i.on !== false);
  const rows = items.map(it => {
    const net = itemNet(it, q);
    const vat = r2(net * vr);
    return { it, net, vat, gross: r2(net + vat), budget: it.kind === 'ads' ? (+it.budget || 0) : 0 };
  });
  const net = r2(rows.reduce((s, r) => s + r.net, 0));
  const vat = r2(rows.reduce((s, r) => s + r.vat, 0));
  const gross = r2(net + vat);
  const budgets = r2(rows.reduce((s, r) => s + r.budget, 0));
  const pays = computePayments(q, rows, gross);
  return { rows, net, vat, gross, budgets, grand: r2(gross + budgets), pays, vr };
}

// كل دفعة: pct عام أو per[itemUid] نسبة لكل بند. آخر دفعة = المتبقي تلقائياً
function computePayments(q, rows, totalGross) {
  const P = q.payments || [];
  if (!P.length) return [];
  const used = {};
  rows.forEach(r => used[r.it.uid] = 0);
  const out = P.map((p, idx) => {
    const last = idx === P.length - 1;
    const parts = rows.map(r => {
      let pct;
      if (last) pct = Math.max(0, 100 - used[r.it.uid]);
      else if (p.mode === 'custom') pct = +((p.per || {})[r.it.uid] ?? 0);
      else pct = +p.pct || 0;
      pct = Math.max(0, Math.min(pct, 100 - used[r.it.uid]));
      used[r.it.uid] += pct;
      return { r, pct, net: r2(r.net * pct / 100) };
    }).filter(x => x.pct > 0 && x.r.net > 0);
    const net = r2(parts.reduce((s, x) => s + x.net, 0));
    const vat = r2(net * ((q.vatRate != null ? q.vatRate : 15) / 100));
    return { p, parts, net, vat, gross: r2(net + vat) };
  });
  // تصحيح فروق التقريب في آخر دفعة
  const sum = r2(out.slice(0, -1).reduce((s, x) => s + x.gross, 0));
  const lastP = out[out.length - 1];
  if (lastP && lastP.gross > 0) { lastP.gross = r2(totalGross - sum); lastP.vat = r2(lastP.gross - lastP.net); }
  return out;
}

// نص تفصيل الدفعة: "قيمة X (1,500) + 50% من إدارة الحملتين (600) + الضريبة (315)"
function paymentBreakdown(pay, allCount) {
  const groups = {};
  pay.parts.forEach(x => { (groups[x.pct] = groups[x.pct] || []).push(x); });
  const segs = Object.keys(groups).sort((a, b) => b - a).map(pct => {
    const g = groups[pct];
    const cnt = {};
    g.forEach(x => { const k = x.r.it.group || x.r.it.short || x.r.it.name; cnt[k] = (cnt[k] || 0) + 1; });
    const grp = new Set(g.filter(x => x.r.it.group).map(x => x.r.it.group));
    const names = Object.keys(cnt).map(k => cnt[k] > 1 && !grp.has(k) ? k + ' (×' + cnt[k] + ')' : k);
    const amt = g.reduce((s, x) => s + x.net, 0);
    let label = names.length > 2 ? names.slice(0, -1).join('، ') + ' و' + names[names.length - 1] : names.join(' و');
    if (allCount && g.length === allCount && g.length > 1) label = 'إجمالي أتعاب الخدمات';
    else if (names.length > 3) label = names.length + ' خدمات (' + names.slice(0, 2).join('، ') + '…)';
    return (+pct === 100 ? 'قيمة ' + label : fmt(pct) + '% من ' + label) + ' (' + fmt(amt) + ')';
  });
  if (pay.vat > 0) segs.push('الضريبة (' + fmt(pay.vat) + ')');
  return segs.join(' + ');
}

function shortDesc(it) {
  const s = it.costNote || it.desc || '';

function autoStats(items) {
  const st = [];
  const pieces = items.reduce((s, i) => s + (i.counts || []).reduce((a, c) => a + (+c.n || 0), 0), 0);
  const ads = items.filter(i => i.kind === 'ads').length;
  const plats = new Set();
  const np = x => x.trim().replace(/^(ا|إ)نست(ج|ق|غ)رام$/, 'إنستقرام').replace(/^ميتا.*/, 'إنستقرام');
  items.forEach(i => { if (i.platform) plats.add(np(i.platform)); (i.platforms || '').split(/[+،,و]\s/).map(np).filter(Boolean).forEach(x => plats.add(x)); });
  if (items.length && items.every(i => i.cat === 'brand')) return [{ n: '02', l: 'نموذجان للشعار مع الفلسفة' }, { n: two(items.length), l: 'عناصر ضمن منظومة الهوية' }, { n: 'AI / PDF', l: 'تسليم شامل لكل الصيغ' }];
  if (pieces) st.push({ n: pieces, l: 'قطعة محتوى شهريًا' });
  if (plats.size) st.push({ n: two(plats.size), l: plats.size === 2 ? 'منصتا نشر أساسيتان' : 'منصات مستهدفة' });
  if (ads) st.push({ n: two(ads), l: ads === 1 ? 'حملة إعلانية' : ads === 2 ? 'حملتان متكاملتان' : 'حملات متكاملة' });
  if (st.length < 2) st.push({ n: two(items.length), l: 'خدمات ضمن العرض' });
  return st;
}
function fmtDate(d) {

const PAGE_H = 1123 - 58 - 62; // ارتفاع منطقة المحتوى
function paginate(blocks, themeStyle) {
  const m = document.createElement('div');
  m.className = 'qpage'; m.setAttribute('style', themeStyle + ';position:absolute;left:0;top:0;height:auto;visibility:hidden');
  const inner = document.createElement('div'); inner.style.cssText = 'width:642px';
  const jail = document.createElement('div'); jail.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;overflow:hidden';
  m.appendChild(inner); jail.appendChild(m); document.body.appendChild(jail);
  inner.innerHTML = blocks.map(b => `<div class="qblk">${b.html}</div>`).join('');
  const els = [...inner.children];
  const hs = els.map(e => e.getBoundingClientRect().height);
  document.body.removeChild(jail);
  const pages = [[]]; let used = 0;
  for (let i = 0; i < blocks.length; i++) {
    let h = hs[i];
    // keep: يلتصق بالبلوك التالي (عناوين)
    let need = h; if (blocks[i].keep && i + 1 < blocks.length) need += Math.min(hs[i + 1], 220);
    const cur = pages[pages.length - 1];
    if ((blocks[i].newPage && cur.length) || (used + need > PAGE_H && cur.length)) { pages.push([]); used = 0; }
    pages[pages.length - 1].push(blocks[i]); used += h;
  }
  return pages;
}

const bidiPct = h => h.replace(/>([^<]+)</g, (m, t) => '>' + t.replace(/(\d[\d.,]*\s?%)/g, '<bdi dir="ltr">$1</bdi>') + '<');
function renderPages(q, S, img) {

function loadImgEl(src, cors) {
  return new Promise((res, rej) => { const i = new Image(); if (cors) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
// ضغط لصيغة WebP مع الحفاظ على الشفافية وتحت حد حجم مستند Firestore
async function compressImage(src, maxW = 1400, maxLen = 680000) {
  const im = await loadImgEl(src);
  let w = Math.min(maxW, im.naturalWidth), q = 0.9, out = '';
  for (let t = 0; t < 8; t++) {
    const h = Math.round(im.naturalHeight * w / im.naturalWidth);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);
    out = c.toDataURL('image/webp', q);
    if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
    if (out.length < maxLen) break;
    if (q > 0.62) q -= 0.12; else w = Math.round(w * 0.8);
  }
  return out;
}

function fillDefaults(q) {
  const t = templateCopy(q);

  ['title', 'subtitle', 'tagline', 'subhead', 'intro', 'closingTitle', 'closingSub'].forEach(k => { if (!q[k]) q[k] = t[k]; });

  if (q.autoTerms || !q.terms.length) q.terms = defaultTerms(q);

}

function cats(q) { const s = new Set(q.items.map(i => i.cat)); return { brand: s.has('brand'), ads: s.has('ads'), social: s.has('social'), web: s.has('web'), local: s.has('local'), monthly: q.items.some(i => i.kind === 'monthly') }; }
function templateCopy(q) {
  const c = cats(q), name = q.client.name || 'العميل', ind = q.client.industry;
  const names = [...new Set(q.items.map(i => i.group ? i.name : (i.short || i.title || i.name)))];
  const list = names.length > 1 ? names.slice(0, -1).join('، ') + ' و' + names[names.length - 1] : (names[0] || '');
  let title = 'عرض سعر تطوير الحضور الرقمي', subtitle = 'يهيئ العلامة لاستقبال فرص جديدة من البحث والحملات الإعلانية';

async function generate3D() {
  if (!S.ai.key) throw new Error('أضف مفتاح OpenAI API من الإعدادات');
  const prompt = Q.imagePrompt || buildImagePrompt(Q);
  const logo = img(Q.client.logoImg);
  const common = { model: S.ai.imageModel || 'gpt-image-1.5', size: '1536x1024', quality: S.ai.quality || 'medium', background: 'transparent', output_format: 'png' };
  const call = async (bg) => {
    let r;
    if (logo) {
      const fd = new FormData();
      Object.entries(Object.assign({}, common, { background: bg })).forEach(([k, v]) => fd.append(k, v));
      fd.append('prompt', prompt);
      const blob = await (await fetch(await toPng(logo))).blob();
      fd.append('image[]', blob, 'logo.png');
      r = await fetch('https://api.openai.com/v1/images/edits', { method: 'POST', headers: { Authorization: 'Bearer ' + S.ai.key }, body: fd });
    } else {
      r = await fetch('https://api.openai.com/v1/images/generations', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + S.ai.key },
        body: JSON.stringify(Object.assign({}, common, { background: bg, prompt })) });
    }
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || ('OpenAI ' + r.status));
    return j.data[0].b64_json;
  };
  let b64;
  try { b64 = await call('transparent'); } catch (e) { if (/background|transparent/i.test(e.message)) b64 = await call('auto'); else throw e; }
  let d = 'data:image/png;base64,' + b64;
  Q.img3d = await putImage(await compressImage(d));
}
async function toPng(src) { const im = await loadImgEl(src); const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); return c.toDataURL('image/png'); }

// تضمين خط IBM Plex Sans Arabic (العربي واللاتيني فقط) كـ base64 عشان الـ PDF يطلع بنفس الخط على أي جهاز
let FONT_CSS = null;
async function getFontCSS() {
  if (FONT_CSS != null) return FONT_CSS;
  try {
    const href = [...document.querySelectorAll('link[rel=stylesheet]')].map(l => l.href).find(h => h.includes('fonts.googleapis'));
    const css = await (await fetch(href)).text();
    const blocks = css.split(/(?=\/\*\s*[\w-]+\s*\*\/)/).filter(b => /\/\*\s*(arabic|latin)\s*\*\//.test(b));
    const use = blocks.length ? blocks : [css];
    const out = await Promise.all(use.map(async b => {
      const urls = [...new Set([...b.matchAll(/url\(([^)]+)\)/g)].map(m => m[1]))];
      for (const raw of urls) {
        const blob = await (await fetch(raw.replace(/["']/g, ''))).blob();
        const d = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        b = b.split('url(' + raw + ')').join('url(' + d + ')');
      }
      return b;
    }));
    FONT_CSS = out.join('\n');
  } catch (e) { console.warn('font embed', e); FONT_CSS = ''; }
  return FONT_CSS;
}
async function exportPDF(mode) {
  fillDefaults(Q); await saveQuote();
  const o = overlay(`<div class="prog"><div class="spin"></div><b id="pg">تجهيز الـ PDF...</b></div>`); o.dataset.lock = 1;

    await ensureFonts();

    host.innerHTML = renderPages(Q, S, img); document.body.appendChild(host);
    const pages = $$('.qpage', host);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const fontCSS = await getFontCSS();
    const opts = { pixelRatio: 2, backgroundColor: '#ffffff', fontEmbedCSS: fontCSS, width: 794, height: 1123 };
    if (/iP(hone|ad|od)|Safari/.test(navigator.userAgent) && !/Chrome|Android/.test(navigator.userAgent)) { try { await htmlToImage.toCanvas(pages[0], opts); } catch (e) { } }
    for (let i = 0; i < pages.length; i++) {
      $('#pg', o).textContent = `صفحة ${i + 1} من ${pages.length}...`;
      const cv = await htmlToImage.toCanvas(pages[i], opts);
      if (i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      const pr = pages[i].getBoundingClientRect(), k = 210 / 794;
      $$('a[data-link]', pages[i]).forEach(a => { const u = a.dataset.link; if (!u) return; const r = a.getBoundingClientRect(); pdf.link((r.left - pr.left) * k, (r.top - pr.top) * k, r.width * k, r.height * k, { url: u }); });
    }
    host.remove();
    const name = `عرض سعر - ${Q.client.name || ''} - ${Q.no}.pdf`.replace(/[\\/:*?"<>|]/g, '');
    const blob = pdf.output('blob');
    if (!Q.status) { Q.status = 'sent'; dirty(); }
    o.remove();
    if (mode === 'share' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/pdf' });
      if (navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('تم تجهيز الـ PDF');
  } catch (e) { console.error(e); o.remove(); toast('تعذر إنشاء PDF: ' + e.message, 1); }
}

});

/* ===================== عرض من نص حر + أسئلة قبل الإصدار ===================== */
const findSvc = id => SERVICES.find(s => s.id === id) || DEFAULT_SERVICES.find(s => s.id === id);

// كلمات مفتاحية → خدمة من الكتالوج (الترتيب مهم: الأدق أولاً)
const KW = [
  [/حمل[ةه].*(جوجل ?ماب|خرائط|ماب)/, 'ads_maps'], [/حمل[ةه].*تيك ?توك/, 'ads_tiktok'], [/حمل[ةه].*(ان|إن)ست/, 'ads_instagram'],
  [/حمل[ةه].*سناب/, 'ads_snap'], [/حمل[ةه].*(تويتر|اكس|إكس)/, 'ads_x'], [/حمل[ةه].*(ميتا|فيس)/, 'ads_meta'], [/حمل[ةه].*يوتيوب/, 'ads_youtube'],
  [/حمل[ةه].*لينكد/, 'ads_linkedin'], [/حمل[ةه].*جوجل/, 'ads_google'],
  [/ملف (ال)?شرك[ةه]|بروفايل|ملف تعريفي|company profile/i, 'company_profile'],
  [/(ملف|حساب|تظبيط|تجهيز|إنشاء|انشاء).*(جوجل ?ماب|خرائط ?جوجل|google ?map)/i, 'gmaps'],
  [/هوي[ةه] (ال)?سوشيال/, 'social_identity'], [/سوشيال|إدارة (ال)?حسابات|ادارة (ال)?حسابات|سوشال/, 'smm_full'],
  [/متجر/, 'store'], [/صفح[ةه] هبوط|لاندنج|landing/i, 'landing'], [/موقع/, 'website'], [/seo|سيو|محركات البحث/i, 'seo'],
  [/دليل|جايدلاين|guideline/i, 'brand_guide'], [/هوي[ةه]|شعار|لوجو|logo/i, 'brand_core'], [/بروشور|بروشر/, 'brochure'],
  [/كارت|بزنس ?كارد|بطاق[ةه] (أعمال|اعمال)/, 'bcard'], [/واتس/, 'wa_business'], [/تصوير|صانع محتوى/, 'shooting'],
  [/موشن|انيميشن/, 'motion'], [/مؤثر|انفلونسر/, 'influencers'], [/كتاب[ةه] (ال)?محتوى/, 'copywriting'], [/تقرير/, 'reports'],
];
const PLATS = [[/(ان|إن)ست(ج|ق|غ)رام|instagram/i, 'إنستقرام'], [/تيك ?توك|tiktok/i, 'تيك توك'], [/تويتر|twitter|(^| )x( |$)|إكس/i, 'إكس (تويتر)'],
  [/سناب/, 'سناب شات'], [/فيس ?بوك|facebook/i, 'فيسبوك'], [/يوتيوب|youtube/i, 'يوتيوب'], [/لينكد/, 'لينكدإن'], [/واتس/, 'واتساب']];
const num = s => +String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g, '');

function parseBrief(text) {
  const lines = text.replace(/[⁠​‎‏‪-‮]/g, '').split(/\n+/)
    .map(l => l.replace(/^[\s*•\-–—·▪●◦○✓✔☑]+/, '').trim())
    .filter(Boolean);
  const out = { client: '', items: [], entities: [], notes: [] };
  let cur = null, entMode = false, lastAds = null, platMode = false;
  const priceOf = l => { const m = l.match(/([\d٠-٩][\d٠-٩,\.]*)\s*(ريال|ر\.?\s?س|sar|﷼)/i); return m ? num(m[1]) : null; };
  for (let raw of lines) {
    const l = raw.replace(/\s*:\s*$/, '').trim();
    if (/عرض\s*سعر/.test(l) && !out.client) { out.client = l.replace(/.*عرض\s*سعر\s*(ل|لـ)?\s*/, '').replace(/[:：]/g, '').replace('إلاعمال', 'الأعمال').trim(); continue; }
    const price = priceOf(l), pct = l.match(/(\d+(?:\.\d+)?)\s*%/), free = /مجان|مجاناً|مجانا|free/i.test(l);
    const per = /لكل\s*(مجال|نشاط|فرع|حساب|براند|قسم|منص[ةه])/.test(l);
    const entH = !price && l.match(/(\d+)\s*(مجالات|أنشطة|انشطة|نشاطات|فروع|حسابات|براندات|أقسام)/);
    if (entH) { entMode = true; platMode = false; out.entityWord = entH[2]; continue; }
    const kw = KW.find(([re]) => re.test(l));
    // نسبة إدارة الحملة
    if (pct && /إدار|ادار/.test(l) && !kw) { (lastAds || cur || {}).fee = +pct[1]; if (lastAds) lastAds.feeSet = true; continue; }
    if (kw) {
      entMode = false; platMode = false;
      const svc = findSvc(kw[1]);
      cur = { src: kw[1], name: cleanName(l) || (svc && svc.name), kind: svc ? svc.kind : 'fixed', per, details: [], platforms: [] };
      if (/شهر|شهري/.test(l) && cur.kind !== 'ads') cur.kind = 'monthly';
      if (free) cur.price = 0;
      if (price != null) { if (cur.kind === 'ads') cur.budget = price; else cur.price = price; }
      if (pct && cur.kind === 'ads') cur.fee = +pct[1];
      out.items.push(cur); if (cur.kind === 'ads') lastAds = cur;
      continue;
    }
    if (/^منصات$|^المنصات$/.test(l)) { platMode = true; continue; }
    const plat = PLATS.find(([re]) => re.test(l));
    if (plat && l.length < 30 && cur) { cur.platforms.push(plat[1]); continue; }
    if (entMode && !price && l.length < 40) { out.entities.push(l); continue; }
    if (cur) {
      if (per) cur.per = true;
      if (price != null) { if (cur.kind === 'ads') cur.budget = price; else cur.price = price; }
      if (free && price == null) cur.price = 0;
      if (/شهر|شهري/.test(l) && cur.kind !== 'ads') cur.kind = 'monthly';
      const d = cleanName(l); if (d && !/^لكل\s*\S+$/.test(d)) cur.details.push(d);
    } else out.notes.push(l);
  }
  return out;
}
function cleanName(l) {
  return l.replace(/([\d٠-٩][\d٠-٩,\.]*)\s*(ريال|ر\.?\s?س|sar|﷼)(\s*(\/|في|ب)?\s*(ال)?(شهر|شهري|شهريا|شهرياً))?/ig, '')
    .replace(/(\d+(?:\.\d+)?)\s*%/g, '').replace(/\b(مجاني|مجانا|مجاناً)\b|مجاني[ةه]?/g, '').replace(/لكل\s*(مجال|نشاط|فرع|حساب|براند|قسم)/g, '')
    .replace(/[:：]+/g, '').replace(/\s{2,}/g, ' ').trim();
}

// تحويل نتيجة التحليل لبنود عرض
function briefToItems(p) {
  const items = [];
  const ents = p.entities.length ? p.entities : [''];
  p.items.forEach(b => {
    const svc = findSvc(b.src) || {};
    const list = b.per && p.entities.length ? ents : [''];
    list.forEach(ent => {
      const it = itemFromService(Object.assign({ id: b.src }, clone(svc)));
      it.kind = b.kind;
      if (b.kind === 'ads') { if (b.budget != null) it.budget = b.budget; if (b.fee != null) it.fee = b.fee; }
      else if (b.price != null) it.price = b.price;
      const base = svc.name || b.name;
      it.name = base;
      if (ent) { it.title = base + ' — ' + ent; it.short = shortOf(b.src, base) + ': ' + ent; it.entity = ent; it.group = groupOf(b.src, base, list.length); }
      if (b.platforms.length) it.platforms = b.platforms.join(' + ');
      if (b.kind === 'ads') { it.platform = svc.platform || it.platform; if (ent) it.objective = 'الظهور المحلي لـ' + ent; }
      if (b.details.length) {
        const det = b.details.filter(d => d.length > 2);
        if (b.src.startsWith('smm') && det.some(d => /نشر يومي/.test(d))) it.counts = [{ n: 30, l: 'منشور شهريًا (نشر يومي)' }];
        else if (b.src.startsWith('smm')) it.counts = [];
        it.bullets = det.map(d => d + (ent ? '' : '')).concat((svc.bullets || []).slice(0, 2)).slice(0, 4);
      } else if (b.src.startsWith('smm')) it.counts = [];
      items.push(it);
    });
  });
  return items;
}
function groupOf(src, name, n) {
  const w = n === 2 ? 'للنشاطين' : n === 3 ? 'للأنشطة الثلاثة' : 'لـ' + n + ' أنشطة';
  return ({ smm_full: 'باقات السوشيال ميديا', smm_basic: 'باقات السوشيال ميديا', ads_maps: 'إدارة حملات خرائط جوجل', ads_tiktok: 'إدارة حملات تيك توك', ads_instagram: 'إدارة حملات إنستقرام', ads_snap: 'إدارة حملات سناب شات', ads_google: 'إدارة حملات جوجل' })[src] ? ({ smm_full: 'باقات السوشيال ميديا', smm_basic: 'باقات السوشيال ميديا', ads_maps: 'إدارة حملات خرائط جوجل', ads_tiktok: 'إدارة حملات تيك توك', ads_instagram: 'إدارة حملات إنستقرام', ads_snap: 'إدارة حملات سناب شات', ads_google: 'إدارة حملات جوجل' })[src] + ' ' + w : name + ' ' + w;
}
function shortOf(src, name) {
  return ({ smm_full: 'سوشيال ميديا', ads_maps: 'حملة خرائط جوجل', ads_tiktok: 'حملة تيك توك', ads_instagram: 'حملة إنستقرام', gmaps: 'ملف خرائط جوجل' })[src] || name;
}

async function aiParseBrief(txt, fallback) {
  const ids = (SERVICES.length ? SERVICES : DEFAULT_SERVICES).map(s => s.id + ': ' + s.name + ' [' + s.kind + ']').join('\n');
  const j = await oaJSON('أنت مساعد مبيعات في وكالة تسويق. حوّل النص لبنود عرض سعر. أعد JSON فقط.',
    `النص:\n${txt}\n\nكتالوج الخدمات (id: الاسم [النوع]):\n${ids}\n\nأعد JSON: {client: اسم العميل, entities: [أسماء المجالات/الأنشطة/الفروع إن وجدت], items: [{src: id من الكتالوج أو company_profile أو custom, name: اسم الخدمة كما في النص, kind: fixed|monthly|ads, price: رقم أو null, budget: ميزانية الإعلان للحملات, fee: نسبة الإدارة %, per: true لو الخدمة متكررة لكل مجال/نشاط, platforms: [المنصات], details: [تفاصيل مذكورة]}]}. لا تخترع أسعاراً غير مذكورة (null).`);
  if (!Array.isArray(j.items) || !j.items.length) return fallback;
  return { client: j.client || fallback.client, entities: j.entities || fallback.entities,
    items: j.items.map(i => ({ src: findSvc(i.src) ? i.src : 'custom', name: i.name, kind: i.kind || 'fixed', price: i.price, budget: i.budget, fee: i.fee, per: !!i.per, platforms: i.platforms || [], details: i.details || [] })) };
}

function applyAnswers(final) {

  Q.autoTerms = true;
  const T = defaultTerms(Q);
  if (a.term && a.term !== '1') { const i = T.findIndex(t => t.startsWith('مرونة')); const t = `مدة التعاقد: ${termTxt}، وتُسدد الخدمات الشهرية في بداية كل شهر وفق جدول الدفعات.`; if (i >= 0) T[i] = t; else T.push(t); }

  (a.extra || '').split('\n').map(s => s.trim()).filter(Boolean).forEach(t => T.push(t));
  if (final) { Q.terms = T; Q.autoTerms = false; } else Q.terms = T;
}
